<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cultivo · Dark Roast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="cultivo.css">
<!-- d3 desenha o mapa e cuida do zoom; topojson-client lê os dados do Natural Earth -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js" defer></script>
<script src="desenhos.js" defer></script>
<script src="cultivo.js" defer></script>
</head>
<body class="origem pagina-cultivo">

  <!-- Mapa em tela cheia (o SVG é desenhado pelo cultivo.js) -->
  <div class="mapa-tela">
    <svg id="mapa-svg" role="img" aria-label="Mapa-múndi com a origem de cada café"></svg>
    <div class="mapa-pontos" id="pontos"></div>
  </div>

  <header class="cultivo-card">
    <a class="cultivo-voltar" href="index.html#origem">Voltar para a origem</a>
    <div class="cultivo-cabeca">
      <span class="cultivo-kanji" lang="ja" aria-hidden="true">栽培</span>
      <h1 class="cultivo-titulo">Cultivo</h1>
    </div>
    <p class="cultivo-dica">Clique em um ponto para ver como o café é cultivado. Arraste e use a roda do mouse para explorar.</p>
  </header>

  <div class="mapa-controles">
    <button type="button" id="zoom-mais" aria-label="Aproximar">+</button>
    <button type="button" id="zoom-menos" aria-label="Afastar">−</button>
    <button type="button" id="zoom-inicio" aria-label="Mostrar todos os cafés">Centralizar</button>
  </div>

  <p class="mapa-legenda">A faixa avermelhada é o cinturão do café, entre os trópicos.</p>
  <p class="mapa-status" id="status" role="status">Carregando o mapa…</p>
</body>
</html>
